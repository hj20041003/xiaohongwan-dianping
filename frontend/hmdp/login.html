<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>小红碗点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">

  <style type="text/css">

      .mock-code-tip {
        text-align: center;
        color: #ff6633;
        font-size: 14px;
        margin: 5px 0;
    }
      .login-page-bg {
          min-height: 100vh;
          background: linear-gradient(160deg, #fff3ec 0%, #ffe0cc 100%);
      }
      .brand-logo {
          text-align: center;
          font-size: 26px;
          font-weight: 700;
          color: #ff6633;
          letter-spacing: 3px;
          padding: 26px 0 18px;
      }
      .login-container {
          max-width: 420px;
          margin: 0 auto;
          background: #ffffff;
          border-radius: 16px;
          box-shadow: 0 8px 30px rgba(255, 102, 51, 0.18);
          padding: 24px 22px;
      }
      .login-radio a, .login-container a { color: #ff6633; }
</style>
<link href="./css/theme.css" rel="stylesheet">
</head>
<body>
<div class="login-page-bg">
<div id="app">
  <div class="brand-logo">🥣 小红碗点评</div>
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack" ><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">手机号码快捷登录&nbsp;&nbsp;&nbsp;</div>
    </div>
    <div class="content">
      <div class="login-form">
        <div style="display: flex; justify-content: space-between">
          <el-input name="phone" style="width: 60%" placeholder="请输入11位手机号" v-model="form.phone" maxlength="11" @input="v => form.phone = v.replace(/[^0-9]/g, '')" >
          </el-input>
          <el-button style="width: 38%" @click="sendCode" type="success" :disabled="disabled">{{codeBtnMsg}}</el-button>
        </div>

        <div style="height: 5px"></div>
        <el-input name="code" placeholder="请输入验证码" v-model="form.code">
        </el-input>
        <div v-if="mockCode" class="mock-code-tip">
          📲 演示环境验证码：<b>{{ mockCode }}</b>（真实环境将通过短信下发）
        </div>
        <div style="text-align: center; color: #8c939d;margin: 5px 0">未注册的手机号码验证后自动创建账户</div>
        <el-button @click="login" style="width: 100%; background-color:#f63; color: #fff;">登录</el-button>
        <div style="text-align: right; color:#333333; margin: 5px 0"><a href="/login2.html">密码登录</a></div>
      </div>
      <div class="login-radio">
        <input name="radio" type="checkbox" id="readed" v-model="radio">
        <label for="readed">我已阅读并同意</label>
        <a href="/agreement.html" target="_blank">《小红碗点评用户服务协议》</a>、
        <a href="/privacy.html" target="_blank">《隐私政策》</a>
        等，接受免除或者限制责任、诉讼管辖约定等粗体标示条款
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      disabled: false, // 发送短信按钮
      codeBtnMsg: "发送验证码", // 发送短信按钮提示
      mockCode: "", // 演示环境回显的验证码（真实环境由短信网关下发）
      form:{
      }
    },
    methods: {
      login(){
        if(!this.radio){
          this.$message.error("请先确认阅读用户协议！");
          return
        }
        if(!this.form.phone || !this.form.code){
          this.$message.error("手机号和验证码不能为空！");
          return
        }
        axios.post("/user/login", this.form)
        .then(({data}) => {
            if(data){
              // 保存用户信息到session
              sessionStorage.setItem("token", data);
            }
            // 跳转到首页
            location.href = "/index.html"
        })
        .catch(err => this.$message.error(err))
      },
      goBack(){
        history.back();
      },
      sendCode(){
        if (!this.form.phone) {
          this.$message.error("手机号不能为空");
          return;
        }
        // 发送验证码
        axios.post("/user/code?phone="+this.form.phone)
          .then(({data}) => {
            // 演示环境直接回显验证码（真实环境由短信网关下发）
            this.mockCode = data;
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          });
        // 禁用按钮
        this.disabled = true;
        // 按钮倒计时
        let i = 60;
        this.codeBtnMsg = (i--) + '秒后可重发'
        let taskId = setInterval(() => this.codeBtnMsg = (i--) + '秒后可重发', 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "发送验证码";
        }, 59000)
      }
    }
  })
</script>
</div>
</body>
</html>
