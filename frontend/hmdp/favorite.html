<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收藏 / 心愿单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; color: #333; }
  header { background: linear-gradient(135deg, #ff4d6a, #ff8866); color: #fff; padding: 22px 20px; }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: .9; margin-top: 6px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin-bottom: 14px; color: #ff4d6a; }
  select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  .shop-item { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid #f2f2f2; }
  .shop-item:last-child { border-bottom: none; }
  .shop-icon { width: 46px; height: 46px; border-radius: 8px; background: linear-gradient(135deg,#ffe0cc,#ffd0d8); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 12px; flex-shrink: 0; }
  .shop-info { flex: 1; min-width: 0; }
  .shop-info .name { font-size: 15px; font-weight: 600; }
  .shop-info .sub { font-size: 12px; color: #999; margin-top: 3px; }
  .fav-btn { border: 1px solid #ff4d6a; background: #fff; color: #ff4d6a; padding: 7px 16px; border-radius: 18px; cursor: pointer; font-size: 13px; transition: all .15s; }
  .fav-btn.on { background: #ff4d6a; color: #fff; }
  .fav-btn:hover { transform: scale(1.05); }
  .empty { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; }
  .tips { font-size: 12px; color: #999; margin-top: 10px; }
</style>
<link href="./css/theme.css" rel="stylesheet">
</head>
<body>
<header>
  <h1>❤️ 收藏 / 心愿单</h1>
  <p>收藏喜欢的商户，随时回来看看 —— 本项目新增功能</p>
</header>
<div class="wrap">
  <div class="card">
    <h2>全部商户</h2>
    <div class="row" style="margin-bottom:6px">
      <label style="font-size:13px;color:#666;margin-right:6px">当前用户</label>
      <select id="userSel" onchange="init()">
        <option value="1">测试用户1</option>
        <option value="2">测试用户2</option>
      </select>
    </div>
    <div id="shopList"><div class="empty">加载中...</div></div>
  </div>
  <div class="card">
    <h2>我的心愿单</h2>
    <div id="favList"><div class="empty">加载中...</div></div>
    <div class="tips">提示：与主站使用同一后端，收藏数据保存在数据库 tb_user_favorite 表中。</div>
  </div>
</div>

<script>
const API = '/api';
const SHOPS = [
  { id: 1, name: '103茶餐厅', addr: '金华路锦昌文华苑29号', price: '¥80/人', tag: '🍜' },
  { id: 2, name: '蔡馬洪涛烤肉·老北京铜锅涮羊肉', addr: '上塘路1035号（中国工商银行旁）', price: '¥85/人', tag: '🍖' },
  { id: 3, name: '新白鹿餐厅(运河上街店)', addr: '台州路2号运河上街购物中心F5', price: '¥61/人', tag: '🦐' }
];

async function init() {
  renderShops();
  renderFavs();
}

async function renderShops() {
  const uid = document.getElementById('userSel').value;
  // 并发检查每个商户的收藏状态
  const el = document.getElementById('shopList');
  el.innerHTML = SHOPS.map(s => `
    <div class="shop-item" id="s${s.id}">
      <div class="shop-icon">${s.tag}</div>
      <div class="shop-info">
        <div class="name">${s.name}</div>
        <div class="sub">${s.addr} · ${s.price}</div>
      </div>
      <button class="fav-btn" data-id="${s.id}">☆ 收藏</button>
    </div>`).join('');
  for (const s of SHOPS) {
    const r = await fetch(`${API}/favorite/check?userId=${uid}&shopId=${s.id}`).then(x => x.json());
    if (r.success && r.data.favorite) setBtn(s.id, true);
  }
  el.querySelectorAll('.fav-btn').forEach(btn => {
    btn.onclick = () => toggleFav(Number(btn.dataset.id));
  });
}

function setBtn(shopId, on) {
  const btn = document.querySelector(`#s${shopId} .fav-btn`);
  if (!btn) return;
  btn.classList.toggle('on', on);
  btn.textContent = on ? '❤️ 已收藏' : '☆ 收藏';
}

async function toggleFav(shopId) {
  const uid = document.getElementById('userSel').value;
  const r = await fetch(`${API}/favorite/toggle?userId=${uid}&shopId=${shopId}`, { method: 'POST' }).then(x => x.json());
  if (r.success) { setBtn(shopId, r.data.favorite); renderFavs(); }
}

async function renderFavs() {
  const uid = document.getElementById('userSel').value;
  const r = await fetch(`${API}/favorite/list?userId=${uid}`).then(x => x.json());
  const el = document.getElementById('favList');
  if (!r.success || !r.data.length) { el.innerHTML = '<div class="empty">心愿单还是空的，去上面挑一家吧～</div>'; return; }
  el.innerHTML = r.data.map(s => {
    const meta = SHOPS.find(x => x.id === s.id) || {};
    return `<div class="shop-item">
      <div class="shop-icon">${meta.tag || '🏪'}</div>
      <div class="shop-info">
        <div class="name">${s.name}</div>
        <div class="sub">${s.address || ''} · ¥${s.avgPrice || '-'}/人</div>
      </div>
      <button class="fav-btn on" onclick="toggleFav(${s.id})">❤️ 已收藏</button>
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
