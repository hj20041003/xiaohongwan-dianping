
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

    server {
        listen       8080;
        listen       8081;   # 备用端口：新 origin，绕开浏览器旧缓存
        server_name  localhost;
        # 指定前端项目所在的位置（提升到 server 级，确保 .html 正则块也用同一 root）
        root   html/hmdp;
        index  index.html index.htm;

        # HTML 不缓存，避免前端更新后浏览器用旧文件
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            # 支持 /message 无扩展名访问 → 自动映射 message.html
            try_files $uri $uri/ $uri.html =404;
        }

        # 开发期 css/js 也不缓存，杜绝“样式/脚本改了没生效”
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }


        # API代理配置
        location /api {  
            default_type  application/json;
            #internal;  
            keepalive_timeout   30s;  
            keepalive_requests  1000;  
            #支持keep-alive  
            proxy_http_version 1.1;  
            rewrite /api(/.*) $1 break;  
            proxy_pass_request_headers on;
            #more_clear_input_headers Accept-Encoding;  
            proxy_next_upstream error timeout;  
            proxy_pass http://127.0.0.1:8090;
            #proxy_pass http://backend;
        }
        
        # 直接代理所有API请求到后端
        location ~ ^/(shop-type|blog|shop|user|follow)/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    upstream backend {
        server 127.0.0.1:8090 max_fails=5 fail_timeout=10s weight=1;
        #server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }  
}
